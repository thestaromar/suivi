<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdeee9">
<title>Mon suivi quotidien</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1c1f27;--mut:#6b7280;--bd:#e3e6ec;--ac:#4f6df5;--ac2:#e8ecff;--ok:#16a34a;--okb:#dcfce7;--wa:#b45309;--wab:#fef3c7;--er:#dc2626;--erb:#fee2e2}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
main{max-width:820px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px 20px;overflow-x:hidden}
h2{margin:4px 0 8px;font-size:21px}h3{margin:4px 0 8px;font-size:16px}p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sb{justify-content:space-between}.end{justify-content:flex-end;margin-top:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
button.d{color:var(--er)}button.s{padding:4px 9px;min-height:32px;font-size:13px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input[type=checkbox],input[type=radio]{width:auto}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.f>span{font-size:13px;color:var(--mut);font-weight:600}
.muted{color:var(--mut)}.small,small{font-size:13px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0}
.li.ok{color:var(--ok)}.li.er{color:var(--er)}.acts{display:flex;gap:4px;flex-shrink:0}
.ck{display:flex;gap:10px;align-items:center;cursor:pointer;flex:1;padding:4px 0}.ck input{width:22px;height:22px;accent-color:var(--ac);flex-shrink:0}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:12px;font-weight:600}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.er{background:var(--erb);color:var(--er)}.tag.wa{background:var(--wab);color:var(--wa)}
.okc{color:var(--ok)}.erc{color:var(--er)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--ac);border-radius:6px}.bar.over>i{background:var(--wa)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{min-height:30px;padding:3px 10px;font-size:13px;border-radius:99px}
.chip.ok{background:var(--okb);border-color:var(--ok)}.chip.er{background:var(--erb);border-color:var(--er)}.chip.wa{background:var(--wab)}.chip.cur{outline:2px solid var(--ac);outline-offset:1px}
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin:10px 0}.stats4 div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}.stats4 small{display:block;color:var(--mut)}.stats4 b{font-size:17px}
.excard h2{font-size:24px}.logs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tdisp{font-size:36px;font-variant-numeric:tabular-nums}.timer{border-color:var(--ac)}
.navrun{margin-bottom:10px}.navrun button{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:8px}
.kpi{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}.kpi b{font-size:19px}.kpi small{color:var(--mut);font-weight:600}
.ph{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-bottom:8px;pointer-events:none}.phprev{max-width:160px;border-radius:10px;margin:6px 0}
.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.datebar .dmid{flex:1;text-align:center;min-width:150px}.datebar input{width:auto}
.rate{display:flex;gap:6px}.rate label{flex:1;position:relative}.rate input,.dck input{position:absolute;opacity:0;pointer-events:none}
.rate span,.dck span{display:block;text-align:center;padding:8px 0;border:1px solid var(--bd);border-radius:10px;cursor:pointer;user-select:none}
.rate input:checked+span,.dck input:checked+span{background:var(--ac);color:#fff;border-color:var(--ac)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dck{position:relative}.dck span{padding:7px 0;font-size:13px}
details{margin:4px 0}summary{cursor:pointer;padding:8px 0}details.sub{border:1px solid var(--bd);border-radius:12px;padding:0 10px 8px;margin-bottom:8px}
details.set>summary{font-weight:700;font-size:16px}
.plan{padding:8px 0;border-bottom:1px solid var(--bd)}.tour{margin:8px 0;padding-left:8px;border-left:3px solid var(--ac2)}
.err{color:var(--er);background:var(--erb);padding:8px 10px;border-radius:10px;margin-bottom:10px}
/* Mon corps — tient dans un écran d'iPhone */
:root{--chrome:calc(36px + env(safe-area-inset-top) + env(safe-area-inset-bottom) + var(--tb,0px))}
@media(min-width:900px){:root{--chrome:calc(36px + var(--tb,0px))}}
.bodyv{display:flex;flex-direction:column;gap:8px;height:calc(100vh - var(--chrome) - 2px);height:calc(100dvh - var(--chrome) - 2px);max-width:560px;margin:0 auto}
.bv-title{font-size:20px;font-weight:800;margin:0}
.bcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex-shrink:0}
.bcard{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:7px 9px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.05);min-width:0;min-height:0}
.bcard:disabled{opacity:1;cursor:default}.bcard.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.bcard small{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.bcard b{font-size:18px;line-height:1.25}.bcard span{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.bcard i{font-style:normal;font-weight:700}
.sil{flex:1;min-height:90px;container-type:size;display:flex;justify-content:center;align-items:center}
.silin{position:relative;width:min(100cqw,calc(100cqh * 620 / 540));aspect-ratio:620/540;container-type:size}
.silin svg{width:100%;height:100%;display:block}
.sil .sk{fill:url(#skin);stroke:#a9a2b8;stroke-width:1.3;stroke-linejoin:round}.sil .nos{fill:none;stroke:#cfc8da}
.sil .mu{fill:none;stroke:#c3bbd0;stroke-width:1.2;stroke-linecap:round}
.sil .zn{opacity:.42;cursor:pointer;transition:opacity .15s}.sil .zn:hover{opacity:.65}.sil .zn.sel{opacity:.9;stroke:#fff;stroke-width:2}
.sil .lead{fill:none;stroke-width:1.4;stroke-dasharray:3 3}
.zlab{position:absolute;width:25%;transform:translateY(-50%);background:#fff;border:1px solid var(--bd);border-left:4px solid var(--zc);border-radius:9px;padding:2px 5px;min-height:0;display:flex;flex-direction:column;align-items:flex-start;gap:0;box-shadow:0 2px 6px rgba(0,0,0,.06);text-align:left}
.zlab.l{left:0}.zlab.r{right:0}
.zlab{font-size:clamp(8px,3.6cqh,12px);padding:.2em .45em}.zlab b{font-size:1em;line-height:1.2}.zlab span{font-size:1em;color:var(--mut);white-space:nowrap;line-height:1.2}.zlab i{font-style:normal;color:var(--zc);font-weight:700}
.zlab.sel{background:var(--zc);border-color:var(--zc)}.zlab.sel b,.zlab.sel span,.zlab.sel i{color:#fff}
.zleg{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px;font-size:10px;color:var(--mut);flex-shrink:0}
.zleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.zpanel{flex-shrink:0;background:#1f2433;color:#eef0f6;border-radius:20px;padding:12px 14px;box-shadow:0 10px 24px rgba(20,24,40,.25)}
.zp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.zp-name{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9aa3bb}.zp-name em{font-style:normal;opacity:.7;margin-left:4px}
.zp-next.ok{background:#7fd6c8;color:#13202a}.zp-next{background:#2f3650;border:0;color:#fff;border-radius:99px;padding:5px 12px;min-height:30px;font-size:13px;font-weight:600}
.zp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.zpanel .zval{font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-.02em;color:var(--zc);filter:brightness(1.25)}.zpanel .zval small{font-size:16px;font-weight:600;color:#9aa3bb;margin-left:4px}
.zp-sub{font-size:11px;color:#9aa3bb}
.zp-delta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}.zp-delta b{font-size:20px;filter:brightness(1.25)}.zp-delta>span{font-size:12px;color:#9aa3bb}
.zp-link{background:none;border:0;color:#7fd6c8;font-size:12px;padding:0;min-height:0;font-weight:600}
.zp-trend{margin-top:8px;background:#181c28;border-radius:14px;padding:4px 6px}
.zp-empty{margin:0;padding:18px 6px;text-align:center;font-size:12px;color:#8a92a8}
.chart{width:100%;height:auto;display:block}.chart text{font-size:13px;fill:var(--mut)}.chart .gl{stroke:var(--bd)}.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.5}.chart circle{fill:var(--ac)}.chart .tg{stroke:var(--ok);stroke-dasharray:6 4;stroke-width:1.5}.chart .tgt{fill:var(--ok)}
.zpanel .chart text{fill:#8a92a8}.zpanel .chart .gl{stroke:#2e3446}.zpanel .chart .ln{stroke:#f0c43c}.zpanel .chart circle{fill:#f0c43c}.zpanel .chart .tg{stroke:#8fe36a}.zpanel .chart .tgt{fill:#8fe36a}
.zp-add{display:flex;gap:8px;margin-top:8px}
.zp-add input{flex:1;min-width:0;background:#2a3042;border:1px solid #3a4157;color:#fff;border-radius:99px;padding:10px 14px}.zp-add input::placeholder{color:#8a92a8}
.zp-add .p{border-radius:99px;background:#7fd6c8;border-color:#7fd6c8;color:#13202a;white-space:nowrap;padding:0 16px}
/* Jauge de déficit */
.dgauge{display:grid;grid-template-columns:1fr minmax(0,1.9fr) 1fr;align-items:center;gap:4px;background:linear-gradient(170deg,#c6f27d,#96e46c);border-radius:24px;padding:14px 10px 4px;margin:4px 0 18px;color:#14210c;box-shadow:0 8px 20px rgba(80,140,40,.18)}
.dg-side{display:flex;flex-direction:column;align-items:center;gap:2px}.dg-side span{font-size:14px;font-weight:600}
.dg-side b,.dg-c b{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:500}
.dg-side b{font-size:26px}
.dg-mid{position:relative}.dg-mid svg{width:100%;height:auto;display:block}
.dg-track,.dg-fill{fill:none;stroke-width:13;stroke-linecap:round}.dg-track{stroke:rgba(40,100,20,.22)}.dg-fill{stroke:#2f8a2a;transition:stroke-dasharray .6s ease}
.dg-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:6%;text-align:center}
.dg-c span{font-size:15px;font-weight:600}.dg-c b{font-size:clamp(28px,8.5vw,44px);line-height:1.1}.dg-c small{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:#3c5a2a}
.dg-base{grid-column:1/-1;text-align:center;font-size:11px;color:#3c5a2a;padding:0 4px 8px}
/* Volet Alimentation */
.shade{position:fixed;inset:0;background:rgba(20,20,20,.38);z-index:40}
.fsheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:620px;margin:0 auto;background:#f5f4f0;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.shade.up{animation:fadeIn .22s ease-out}.fsheet.up{animation:sheetUp .3s cubic-bezier(.2,.8,.3,1)}
.shade.down{opacity:0;transition:opacity .22s}.fsheet.down{transform:translateY(100%);transition:transform .22s ease-in}
@keyframes fadeIn{from{opacity:0}}@keyframes sheetUp{from{transform:translateY(100%)}}
.fs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.fs-head small{font-size:12px;font-weight:700;letter-spacing:.12em;color:#6b6a64}.fs-head h2{font-size:26px;margin:2px 0 0;letter-spacing:-.02em}
.fs-card{background:#fff;border:1px solid var(--bd);border-radius:22px;padding:16px}
.fs-tot{font-size:13px;color:var(--mut);padding:8px 0 4px;border-top:1px solid var(--bd)}
.fs-form{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:10px;border-top:1px solid var(--bd);padding-top:12px}
.fs-form .f{margin:0;min-width:0}.fs-name{grid-column:1/-1}.fs-form .p{min-height:42px;border-radius:12px;padding:0 16px}
@media(min-width:560px){.fs-form{grid-template-columns:2fr 1fr auto}.fs-name{grid-column:auto}}
/* Accueil : programme du jour */
.week{display:flex;gap:4px;align-items:center;margin-bottom:14px}
.wday{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:14px;min-height:54px}
.wday small{font-size:11px;color:var(--mut);text-transform:uppercase}.wday b{font-size:17px}.wday.tod b{color:var(--ac)}
.wday.sel{background:var(--ac);border-color:var(--ac)}.wday.sel small,.wday.sel b{color:#fff}
.wnav{border:0;background:none;font-size:22px;padding:4px 6px;color:var(--mut)}
.htitle{font-size:28px;font-weight:800;letter-spacing:.5px;margin:2px 0 0}
.hsub{margin:0 0 14px}.hprog{margin-bottom:16px}
.blk{background:#fff;border:1px solid var(--bd);border-radius:18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bhead{display:flex;align-items:center;gap:10px;padding:12px}
.bico{width:46px;height:46px;border-radius:14px;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
.blk.done .bico{background:var(--okb)}
.btxt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;align-items:flex-start;min-height:0}
.btxt b{font-size:16px}.btxt small{color:var(--mut)}
.bchev{border:0;background:none;font-size:20px;color:var(--mut);transition:transform .2s;padding:2px 6px;min-height:36px}.bchev.open{transform:rotate(180deg)}
.bgo{width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;background:var(--ac);border-color:var(--ac);color:#fff;font-size:15px;flex-shrink:0}
.blk.done .bgo{background:var(--ok);border-color:var(--ok)}
.bdet{padding:4px 14px 14px;border-top:1px solid var(--bd)}
/* Sport : grille des exercices */
.gh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:4px 0 6px}
.gh small{color:var(--mut);font-weight:600;font-size:13px}
.gh h1{font-size:30px;margin:2px 0 0;font-weight:800;letter-spacing:-.01em}
.gsec{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 2px 8px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;aspect-ratio:1/1.08;border:0;border-radius:22px;padding:14px;background:linear-gradient(160deg,var(--tg2),var(--tg));color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;box-shadow:0 10px 22px rgba(20,20,40,.18);min-height:0}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.t-emo{position:absolute;right:-4px;top:-2px;font-size:68px;line-height:1.1;opacity:.9;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.t-txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.t-txt small{font-size:11px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-txt b{font-size:15px;line-height:1.2}
.t-st{position:absolute;left:12px;top:12px;z-index:1;min-width:28px;height:28px;padding:0 9px;border-radius:99px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.t-st:empty{display:none}.tile.ok .t-st{background:#3f9d5a}
.gfoot{margin:24px 0 8px;display:flex}
.gfoot .p{flex:1;min-height:52px;border-radius:16px;box-shadow:0 8px 18px rgba(79,109,245,.3)}
/* Sport : cartes de séries */
.cc>.sp-top,.face>.sp-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 18px 0}
.sp-pill{background:rgba(255,255,255,.72);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#444;margin:0}
.sp-big{font-size:clamp(46px,14vw,70px);font-weight:800;line-height:1;letter-spacing:-.02em;color:#23252e}
.sp-big small{font-size:.36em;font-weight:600;margin-left:6px;color:#555;letter-spacing:0}
.sp-w{font-size:21px;font-weight:700;color:#3c3f4a;margin-top:6px}
.sp-tap{font-size:12px;color:#6b6e7a;margin-top:8px}
.cc.fl{background:none;box-shadow:none;overflow:visible;perspective:1400px}
.flip{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:26px;background:var(--cbg);box-shadow:0 18px 40px rgba(30,30,60,.14),0 2px 6px rgba(30,30,60,.06);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden}
.face.f2{transform:rotateY(180deg);background:#fff;padding:18px 20px;justify-content:flex-start;gap:10px;overflow:auto}
.exh{background:#f6f7fb;border-radius:16px;padding:10px 10px 4px}.exh-t{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px}.exh-t b{font-size:13px;margin-right:auto}
.lg.r{color:#4f6df5;font-weight:600}.lg.k{color:#e08a2c;font-weight:600}
.dchart{width:100%;height:auto;display:block}.dchart path{fill:none;stroke-width:3.5;stroke-linejoin:round}.dchart path.r{stroke:#4f6df5}.dchart path.k{stroke:#e08a2c}
.dchart circle.r{fill:#4f6df5}.dchart circle.k{fill:#e08a2c}.dchart text{font-size:18px;fill:#7a7d88}.dchart text.r{fill:#4f6df5;font-weight:700;font-size:22px}.dchart text.k{fill:#e08a2c;font-weight:700;font-size:22px}.dchart .ax{stroke:#dfe1e8}
.chist{margin:8px 0}.chist>small{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut)}
.face.f2 input{font-size:22px;font-weight:700;text-align:center;padding:12px}
.cc-vis.tm{flex-direction:column;gap:10px}
/* Chronomètre circulaire */
.chw{position:relative;width:min(62vw,240px);aspect-ratio:1}.chw.sm{width:min(40vw,150px)}
.chw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ch-bg{fill:none;stroke:rgba(0,0,0,.08);stroke-width:7}
.ch-fg{fill:none;stroke:#4a4a52;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ch-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ch-c small{letter-spacing:.14em;font-weight:700;color:#6a6a72;font-size:14px}
.ch-c b{font-size:68px;color:#3d3d44;font-variant-numeric:tabular-nums;line-height:1;font-weight:800}
.chw.sm .ch-c b{font-size:40px}
.ch-sub{font-size:12px;color:#888}
.ch-pp{width:62px;height:62px;min-height:62px;border-radius:50%;background:#4a4a52;color:#fff;border:0;box-shadow:0 8px 16px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15);font-size:18px;padding:0}
.ch-pp.sm{width:48px;height:48px;min-height:48px;font-size:15px}

.cc{position:absolute;left:0;right:0;top:0;bottom:30px;border-radius:26px;background:var(--cbg);box-shadow:0 18px 40px rgba(30,30,60,.14),0 2px 6px rgba(30,30,60,.06);display:flex;flex-direction:column;overflow:hidden;will-change:transform}
.cc.back1{transform:translateY(15px) scale(.95);opacity:.92;pointer-events:none}.cc.back2{transform:translateY(30px) scale(.9);opacity:.7;pointer-events:none}
.cc.front{cursor:grab;touch-action:none;z-index:1}.cs-stage{touch-action:none;overflow:visible}.cc.prev{transform:translateX(125%) rotate(16deg);pointer-events:none;z-index:2;will-change:transform}.cc.front:active{cursor:grabbing}
.cc.enterN{animation:ccRise .28s ease-out}.cc.enterP{animation:ccBack .3s ease-out}
@keyframes ccRise{from{transform:translateY(15px) scale(.95);opacity:.85}to{transform:none;opacity:1}}
@keyframes ccBack{from{transform:translateX(-115%) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.cc-vis{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}

@media(min-width:900px){body{padding-bottom:0;padding-left:210px}nav{top:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:14px 8px}
nav button{flex:0 0 auto;flex-direction:row;gap:10px;font-size:15px;padding:10px 12px;border-radius:10px;justify-content:flex-start}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:var(--card);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
#nav{display:none!important}@media(min-width:900px){body{padding-left:0!important}}
.hset{width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;font-size:20px;flex-shrink:0}

/* Fond pastel dégradé (très clair) */
:root{--grad:radial-gradient(120% 60% at 0% 0%,#f9d6cc 0%,transparent 75%),radial-gradient(90% 50% at 100% 0%,#ecd3ec 0%,transparent 75%),radial-gradient(110% 50% at 90% 45%,#faf1c9 0%,transparent 78%),radial-gradient(100% 55% at 0% 70%,#cff5df 0%,transparent 78%),radial-gradient(90% 50% at 100% 90%,#d6dff9 0%,transparent 78%),radial-gradient(120% 60% at 10% 100%,#cdf1fa 0%,transparent 78%),#fbfbfc}
html{background:#fbfbfc}body{background:transparent!important}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--grad);pointer-events:none}
.cs{background:var(--grad)}
.card,.blk,.bcard,.zlab,.fs-card{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:rgba(255,255,255,.9)}
.wday,.hset{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.95)}
.wday.sel{background:var(--ac)}
.fsheet{background:rgba(250,250,252,.96)}

/* Liquid glass bleu pastel : jours + jauge */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.28));-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(90,120,180,.16),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25)}
.week{padding:6px;border-radius:26px;gap:5px;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.22));-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 24px rgba(90,120,180,.14),inset 0 1px 0 rgba(255,255,255,.9)}
.wnav{padding:2px 4px;font-size:20px}
.wday,.wday.sel{border-radius:99px;min-height:68px;gap:6px;padding:9px 0 7px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}

.wday.sel{background:rgba(255,255,255,.7)}.wday.sel small{color:#4a5a7a}
.wday.sel b{background:linear-gradient(160deg,#b4cff9,#7aa5ec);color:#fff;box-shadow:0 4px 10px rgba(110,155,230,.45)}
.dgauge.glass{display:block;color:#2d3447;padding:16px 16px 14px;border-radius:26px;margin:6px 0 18px}
.dg-title{font-size:17px;font-weight:700}
.dg-mid{position:relative;max-width:230px;margin:4px auto 0}
.dg-track{stroke:rgba(120,135,165,.18)!important;stroke-width:15!important}
.dg-fill{stroke:url(#dgg)!important;stroke-width:15!important}
.dg-knob{fill:#fff;stroke:#7aa5ec;stroke-width:3}
.dgauge .dg-c{padding-bottom:4%;gap:2px}.dgauge .dg-c b{font-family:inherit;font-weight:700;font-size:clamp(34px,10vw,46px);letter-spacing:-.02em}.dgauge .dg-c span{font-size:12px;color:#6c7891;font-weight:500}
.dg-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:2px;padding-top:10px;border-top:1px solid rgba(255,255,255,.6)}
.dg-row>div{display:flex;align-items:center;gap:7px;justify-content:center}.dg-row i{font-style:normal;font-size:18px}
.dg-row span{display:flex;flex-direction:column;font-size:11px;color:#6c7891;line-height:1.2}.dg-row b{font-size:16px;color:#2d3447}

/* Programme du jour : frise verticale + blocs pastel */
.tl{position:relative;padding-left:34px}

.pstage{display:flex;align-items:center;justify-content:center;margin:8px auto 10px!important}
.pslot{position:relative;width:min(74vw,290px);height:min(54vh,400px);margin-top:44px}
.pc{position:absolute;inset:0}
.pcard{position:absolute;inset:0;border-radius:30px;background:linear-gradient(165deg,var(--c1) 0%,var(--c2) 100%);box-shadow:0 22px 40px rgba(60,70,110,.18),inset 0 1px 0 rgba(255,255,255,.7);overflow:hidden;will-change:transform}

.pc.back{pointer-events:none}.pc.back .pprod{display:none}

.pc.prev{z-index:5;pointer-events:none}.pc.prev .pcard{transform:translateX(125%) rotate(12deg)}.pc.prev .pprod{transform:translateX(150%) rotate(10deg)}
.pc.front.enter .pcard{animation:pcIn .45s cubic-bezier(.2,.8,.25,1)}
.pc.front.enter .pprod{animation:ppIn .6s cubic-bezier(.2,.8,.25,1)}

.cc.fl{border:0}

<div id="toast" class="toast"></div>
<script>
'use strict';
/* ================= Utilitaires ================= */
const KEY='suiviQuotidien.app1',OLD_KEY='__aucune_ancienne_donnee__';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const fmtD=(s,o)=>pd(s).toLocaleDateString('fr-FR',o||{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const short=s=>fmtD(s,{day:'numeric',month:'short',year:'numeric'});
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const num=v=>{if(v==null)return NaN;const s=String(v).trim().replace(',','.');return s===''?NaN:Number(s)};
const fmt=n=>(Math.round((+n||0)*10)/10).toLocaleString('fr-FR');
const sign=n=>(n>0?'+':'')+fmt(n);
const dur=m=>{m=Math.round(+m||0);return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+pad(m%60):'')};
const has=v=>v!==null&&v!==undefined&&v!=='';
const byDate=(a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0);
const muted=t=>`<p class="muted">${t}</p>`;
const WD=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const WDL=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const TYPEL={muscu:'Musculation',cali:'Calisthénie',cardio:'Autre activité (durée et calories)'};

/* ===== Programmes fournis (musculation et calisthénie) =====
   Chaque exercice : groupe, unité de poids, repos (s, vide = chrono libre), chrono auto, liste des séries {reps, weight, dur}. */
const X=(name,group,ser,unit)=>({id:uid(),name,group:group||'',unit:unit||'kg',rest:null,auto:ser.some(s=>has(s[3])),
  series:ser.flatMap(([n,reps,weight,dur])=>Array.from({length:n},()=>({reps:has(reps)?reps:null,weight:has(weight)?weight:null,dur:has(dur)?dur:null})))});
const SPORT={
  'Push 1':()=>[X('Développé couché à la machine, assis','Groupe I',[[2,10,9],[1,10,8],[1,10,7]]),X('Développé à la machine, assis','Groupe I',[[4,10,8]]),X('Élévation latérale à un bras à la poulie basse','Groupe I',[[1,10,7],[2,10,5]]),X('Écarté à la poulie','Groupe I',[[4,10,12.5]]),
    X('Extension des triceps à la poulie haute','Groupe II',[[3,10,20],[1,10,17.5]]),X('Pompes','Groupe II',[[4,10]])],
  'Push 2':()=>[X('Écarté à la machine','',[[4,10,40]]),X('Développé couché avec haltères','',[[1,10,15],[1,8,17.5],[1,10,17.5],[1,10,15]]),X('Dips sur banc','',[[4,12,0]]),X('Écarté avec haltères','',[[4,10,7.25]]),
    X('Élévation frontale alternée avec haltères','',[[2,10,7.5],[1,8,7.5],[1,10,5]]),X('Extension des triceps avec haltères, couché','',[[4,10,5]]),X('Élévation latérale avec haltères','',[[4,10,5]])],
  'Pull 1':()=>[X('Tirage poitrine à la poulie haute, prise large','',[[1,10,8],[1,10,10],[1,10,9],[1,9,8]]),X('Rowing à la poulie basse, assis','',[[1,10,22.5],[3,10,25]]),X('Rowing à un bras avec haltère, buste penché','',[[1,10,17.5],[2,10,20],[1,10,17.5]]),
    X('Curl alterné avec haltères','',[[4,10,10]]),X('Élévation latérale avec haltères, buste penché','',[[1,10,5],[1,12,5],[2,10,5]]),X('Curl alterné avec haltères, prise marteau','',[[4,12,7.5]]),X('Tirage au visage à la poulie haute','',[[1,12,6]])],
  'Legs & Abs':()=>{const G='Groupe principal';return [X('Extension des jambes',G,[[1,8,10]]),X('Abduction de la hanche à la machine, assis',G,[[1,12,10]]),X('Adducteurs à la machine',G,[[1,12,10]]),X('Presse des jambes, assis',G,[[1,12,10]]),X('Flexion des jambes, assis',G,[[1,12,10]]),X('Swing avec kettlebell',G,[[1,12,10]]),
    X('Relevé du buste','Groupe I',[[1,null,null,20]]),X('Planche','Groupe I',[[1,null,10,45]]),X('Planche latérale','Groupe I',[[2,null,null,20]]),X('Relevé du buste avec rotation','Groupe I',[[1,null,null,20]]),
    X('Rotation russe avec haltère','Groupe II',[[1,null,10,30]]),X('Flexion latérale avec haltère','Groupe II',[[1,20,10]]),
    X('Crunch à la poulie haute, à genoux','Groupe III',[[1,12,10]]),X('Rotation du buste à la poulie','Groupe III',[[1,12,10]]),X('Relevé de jambes à la machine','Groupe III',[[1,12,10]])]},
  'Abs intense':()=>[X('Rotation russe avec haltère','Groupe principal',[[4,15,10]]),X('Crunch à la machine','Groupe principal',[[1,12,22]],'lb'),
    X('Planche','Groupe I',[[3,null,null,50]]),X('Planche latérale','Groupe I',[[3,null,null,40]]),X('Battement de jambes','Groupe I',[[3,null,null,30]]),X('Relevé de jambes','Groupe I',[[3,null,null,30]]),
    X('Crunch avec rotation','Groupe I',[[1,20]]),X('Relevé du buste','Groupe I',[[3,20]]),X('Relevé du buste avec rotation','Groupe I',[[1,30]])],
};
function caliTours(){const T=(n,pss,se)=>({id:uid(),name:'Tour '+n,exercises:[X('Pompes','',[[1,10]]),X('Dips sur banc','',[[1,10,0]]),X('Crunch','',[[1,20]]),X('Pompes, prise serrée','',[[1,pss]]),X('Relevé de jambes','',[[1,12]]),X('Planche','',[[1,null,null,45]]),X('Squat','',[[1,15]]),X('Pont','',[[1,20]]),
  X('Alpiniste','Finisseur du tour '+n,[[1,null,null,30]]),X('Saut en étoile','Finisseur du tour '+n,[[1,null,null,se]])]});return [T(1,10,60),T(2,8,30),T(3,8,30)]}
/* Conversion des exercices au format précédent (séries / répétitions / poids / durée) vers la liste de séries. */
function normEx(e){if(!Array.isArray(e.series)){const n=has(e.sets)&&+e.sets>0?+e.sets:1;e.series=Array.from({length:n},()=>({reps:has(e.reps)?e.reps:null,weight:has(e.weight)?e.weight:null,dur:has(e.duration)?e.duration:null}))}
  ['sets','reps','weight','duration','trans'].forEach(k=>delete e[k]);if(!e.unit)e.unit='kg';if(e.group==null)e.group='';if(e.rest===undefined)e.rest=null;return e}
function applyRests(ss){ss.forEach(s=>{if(s.type==='muscu')(s.exercises||[]).forEach(e=>{if(!has(e.rest))e.rest=90});
  if(s.type==='cali'){(s.tours||[]).forEach(t=>t.exercises.forEach(e=>{if(!has(e.rest))e.rest=10}));if(!has(s.tourRest))s.tourRest=30}})}
function fillSport(ss){ss.forEach(s=>{
  if(s.type==='muscu'){s.exercises=s.exercises||[];if(!s.exercises.length&&SPORT[s.name])s.exercises=SPORT[s.name]();s.exercises.forEach(normEx)}
  if(s.type==='cali'){s.tours=s.tours||[];if(s.name==='Calisthénie'&&s.tours.every(t=>!t.exercises.length))s.tours=caliTours();s.tours.forEach(t=>t.exercises.forEach(normEx))}})}
/* ================= Données initiales =================
   Seules les valeurs fournies sont pré-remplies. Les exercices, paramètres et objectifs
   nutritionnels non communiqués restent vides et se saisissent dans Réglages. */
function defaults(){
  const all=[0,1,2,3,4,5,6];
  const M=name=>({id:uid(),name,type:'muscu',exercises:[]});
  const Cd=name=>({id:uid(),name,type:'cardio'});
  const p1=M('Push 1'),p2=M('Push 2'),u1=M('Pull 1'),lg=M('Legs & Abs'),ab=M('Abs intense');
  const ca={id:uid(),name:'Calisthénie',type:'cali',tours:[{id:uid(),name:'TOUR 1',exercises:[]},{id:uid(),name:'TOUR 2',exercises:[]}]};
  const co=Cd('Course à pied'),na=Cd('Natation'),bo=Cd('Boxe'),ve=Cd('Vélo'),yo=Cd('Yoga');
  const P=(opts,d)=>({id:uid(),options:opts.map(s=>s.id),duration:d});
  const St=(name,product,brand,desc)=>({id:uid(),name,product:product||'',brand:brand||'',category:'',desc:desc||'',photo:''});
  const o={version:2,created:today(),
    profile:{age:27,height:164,startWeight:77,targetWeight:57},
    goals:{kcal:null,prot:null},
    sessions:[p1,p2,u1,lg,ab,ca,co,na,bo,ve,yo],
    planning:{},
    routines:[
      {id:uid(),name:'Matin',days:all.slice(),steps:[St('Nettoyage visage','Savon','CeraVe'),St('Brossage des dents'),St('Toner tea tree','','Aroma-Zone'),St('Sérum acide salicylique','','Aroma-Zone'),St('Sérum vitamine C','','Aroma-Zone'),St('Crème hydratante','','Nivea'),St('Crème solaire','','La Roche-Posay'),St('Crème corps','','CeraVe')]},
      {id:uid(),name:'Soir',days:all.slice(),steps:[St('Nettoyage visage','Savon','CeraVe'),St('Brossage des dents'),St('Toner tea tree','','Aroma-Zone'),St('Sérum acide hyaluronique','','Aroma-Zone'),St('Crème fluide zinc','','Aroma-Zone'),St('Sérum','','Yves Rocher'),St('Crème du soir','','Yves Rocher','Avec gua sha.'),St('Contour des yeux','','Yves Rocher'),St('Crème corps','','CeraVe')]},
      {id:uid(),name:'Dimanche soir',days:[0],steps:[St('Nettoyant','','Aroma-Zone'),St('Gommage chimique','','Medicube'),St('Masque bleu','','Horace'),St('Stick tea tree'),St('Nettoyage','','CeraVe')]}],
    weights:[],body:{m:[],goals:{}},days:{},workouts:[],routineLogs:[],run:null,rrun:null,careV:1};
  applyCareCatalog(o.routines);o.careV=2;
  o.planning=buildPlanning(o.sessions);o.planV=3;fillSport(o.sessions);applyRests(o.sessions);o.sportV=1;o.fixV=1;return o;
}
/* Planning hebdomadaire, construit à partir des séances existantes (retrouvées par leur nom). */
function buildPlanning(ss){
  const f=n=>ss.find(s=>s.name===n);
  const E=(names,d,label)=>{const o=names.map(f).filter(Boolean).map(s=>s.id);return o.length?{id:uid(),options:o,duration:d,...(label?{label}:{})}:null};
  const L=(...e)=>e.filter(Boolean);
  return {1:L(E(['Course à pied'],30),E(['Push 1'],60,'Push 1'),E(['Calisthénie'],30)),
    2:L(E(['Pull 1'],60,'Pull'),E(['Boxe'],90)),
    3:L(E(['Natation'],30),E(['Push 2'],60,'Push 2'),E(['Calisthénie'],30)),
    4:L(E(['Pull 1'],60,'Pull'),E(['Boxe'],90)),
    5:L(E(['Natation'],30),E(['Calisthénie'],30)),
    6:L(E(['Legs & Abs'],90,'Legs & Abs intense')),
    0:L(E(['Course à pied'],30),E(['Yoga'],60))};
}
/* Reprise des données réellement saisies dans la version précédente (historiques uniquement). */
function migrate(o){
  const d=defaults(),byName=n=>d.sessions.find(s=>s.name===n),rByName=n=>d.routines.find(r=>r.name===n.replace(/^Routine du /,'').replace(/^matin$/,'Matin').replace(/^soir$/,'Soir').replace(/^dimanche soir$/,'Dimanche soir'));
  const p=o.profile||{};
  if(has(p.age))d.profile.age=p.age;if(has(p.height))d.profile.height=p.height;
  if(has(p.refWeight))d.profile.startWeight=p.refWeight;if(has(p.targetWeight))d.profile.targetWeight=p.targetWeight;
  if(o.created)d.created=o.created;
  (o.measures||[]).filter(m=>m.type==='poids').forEach(m=>d.weights.push({id:m.id||uid(),ts:m.ts||0,date:m.date,value:+m.value}));
  (o.workouts||[]).forEach(w=>{const s=byName(w.name);d.workouts.push({id:w.id||uid(),ts:w.ts||0,date:w.date,sessionId:s?s.id:null,name:w.name,type:w.type,duration:w.duration,kcal:w.kcal||null,
    exercises:(w.exercises||[]).map(e=>w.type==='cali'?{name:e.name,tour:'Tour '+e.round,st:e.st==='done'?'done':e.st==='skip'?'skipped':'none',sets:[]}:{name:e.name,st:e.st,sets:e.sets||[]})})});
  (o.routineLogs||[]).forEach(l=>{const r=rByName(l.name||'');d.routineLogs.push({id:l.id||uid(),ts:l.ts||0,date:l.date,routineId:r?r.id:l.routineId,name:l.name})});
  (o.routines||[]).forEach(or=>{const r=rByName(or.name||'');if(r)(or.steps||[]).forEach((s,i)=>{if(s.photo&&r.steps[i])r.steps[i].photo=s.photo})});
  Object.entries(o.days||{}).forEach(([k,v])=>{const food=(v.food||[]).map(e=>{const f=e.per==='portion'?e.qty:e.qty/100;return {id:e.id||uid(),name:e.name,kcal:Math.round((+e.kcal||0)*f*10)/10,prot:Math.round((+e.prot||0)*f*10)/10}});
    const w=v.well||{},well={};if(w.sleepQ)well.sleepQ=w.sleepQ;if(has(w.sleepH))well.sleepH=w.sleepH;if(w.notes)well.notes=w.notes;
    if(food.length||Object.keys(well).length)d.days[k]={food,well}});
  return d;
}
let D;
function load(){
  try{const r=localStorage.getItem(KEY);
    if(r)D=JSON.parse(r);else{const o=localStorage.getItem(OLD_KEY);D=o?migrate(JSON.parse(o)):defaults()}
  }catch(e){D=defaults()}
  if((D.careV||0)<1&&Array.isArray(D.routines)){
    const m=D.routines.find(r=>/matin/i.test(r.name)),st=m&&m.steps.find(x=>x.name==='Sérum acide hyaluronique');if(st)st.name='Sérum acide salicylique';
    (D.routineLogs||[]).forEach(l=>{delete l.steps});
    if(D.rrun)D.rrun={rid:D.rrun.rid,date:D.rrun.date,idx:D.rrun.idx||0};
    D.careV=1;
  }
  if((D.sportV||0)<1&&Array.isArray(D.sessions)){fillSport(D.sessions);D.run=null;D.sportV=1}
  if(Array.isArray(D.sessions))D.sessions.forEach(x=>{(x.exercises||[]).forEach(normEx);(x.tours||[]).forEach(t=>(t.exercises||[]).forEach(normEx))});
  if(D.run&&!D.run.logs)D.run=null;
  if((D.fixV||0)<1&&Array.isArray(D.sessions)){
    const p2=D.sessions.find(x=>x.name==='Pull 2');if(p2){D.sessions=D.sessions.filter(x=>x!==p2);for(const k in D.planning)D.planning[k]=(D.planning[k]||[]).map(q=>({...q,options:q.options.filter(o=>o!==p2.id)})).filter(q=>q.options.length)}
    applyRests(D.sessions);if(D.run&&D.run.sid===(p2&&p2.id))D.run=null;D.fixV=1}
  if((D.careV||0)<2&&Array.isArray(D.routines)){applyCareCatalog(D.routines);D.careV=2}
  if((D.planV||0)<3&&Array.isArray(D.sessions)){D.planning=buildPlanning(D.sessions);D.planV=3}
  const d=defaults();for(const k in d)if(D[k]===undefined)D[k]=d[k];
  if(!D.body.m)D.body.m=[];if(!D.body.goals)D.body.goals={};
  save();
}
let saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){if(!saveWarned){saveWarned=true;setTimeout(()=>toast('Sauvegarde indisponible ici : ouvrez l’app depuis son adresse web'),300)}}}
const S={zone:null,page:'today',date:today(),woLim:20,logLim:20,open:new Set(),exp:new Set(),anim:0};
const commit=()=>{save();render()};

const getDay=s=>{const d=D.days[s]||{};return {food:d.food||[],well:d.well||{}}};
const dayW=s=>{const d=D.days[s]||(D.days[s]={});d.food=d.food||[];d.well=d.well||{};return d};
const tot=s=>getDay(s).food.reduce((a,e)=>({kcal:a.kcal+(+e.kcal||0),prot:a.prot+(+e.prot||0)}),{kcal:0,prot:0});
const getSes=id=>D.sessions.find(s=>s.id===id);
const getRou=id=>D.routines.find(r=>r.id===id);
const workoutsOn=s=>D.workouts.filter(w=>w.date===s);
const routinesOn=s=>D.routines.filter(r=>r.days.includes(pd(s).getDay()));
const logOf=(s,rid)=>D.routineLogs.find(l=>l.date===s&&l.routineId===rid);
/* Une activité planifiée n'est réalisée que si une séance correspondante a été enregistrée ce jour-là. */
function planStatus(s){const used=new Set(),wo=workoutsOn(s);
  return (D.planning[pd(s).getDay()]||[]).map(p=>({...p,ses:p.options.map(getSes).filter(Boolean)})).filter(p=>p.ses.length)
    .map(p=>{const w=wo.find(x=>!used.has(x.id)&&x.slot===p.id)||wo.find(x=>!used.has(x.id)&&!x.slot&&p.options.includes(x.sessionId));if(w)used.add(w.id);return {...p,w}})}
const exList=(s,tid)=>s.type==='cali'?(s.tours.find(t=>t.id===tid)||{exercises:[]}).exercises:s.exercises;
const exDesc=e=>serDesc(e);
const stepTitle=x=>x.name+(x.product?' — '+x.product:'')+(x.brand?' ('+x.brand+')':'');
const daysLbl=d=>d.length===7?'tous les jours':[1,2,3,4,5,6,0].filter(i=>d.includes(i)).map(i=>WD[i]).join(', ');
function mvArr(a,id,dir){const i=a.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}

/* ================= Composants ================= */
const F=(label,html)=>`<label class="f"><span>${label}</span>${html}</label>`;
const I=(name,val='',a='')=>`<input name="${name}" value="${esc(val)}" ${a}>`;
const N=(name,val,a='')=>I(name,val??'',`inputmode="decimal" autocomplete="off" ${a}`);
const DT=(name,val)=>`<input type="date" name="${name}" value="${esc(val)}" required>`;
const TA=(name,val,rows=3)=>`<textarea name="${name}" rows="${rows}">${esc(val||'')}</textarea>`;
const SEL=(name,opts,val,a='')=>`<select name="${name}" ${a}>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const DAYS=sel=>`<div class="days">${[1,2,3,4,5,6,0].map(i=>`<label class="dck"><input type="checkbox" name="days" value="${i}" ${sel.includes(i)?'checked':''}><span>${WD[i]}</span></label>`).join('')}</div>`;
const bar=(pc,over)=>`<div class="bar ${over?'over':''}"><i style="width:${Math.min(100,Math.max(0,pc))}%"></i></div>`;
const kpi=(l,v,s)=>`<div class="kpi"><small>${l}</small><b>${v}</b>${s?`<span class="small muted">${s}</span>`:''}</div>`;
const ud=(a,id,extra='')=>`<button class="s" data-a="${a}" data-id="${id}" data-v="-1" ${extra} title="Monter">↑</button><button class="s" data-a="${a}" data-id="${id}" data-v="1" ${extra} title="Descendre">↓</button>`;
const dateBar=()=>`<div class="card datebar"><button data-a="dNav" data-v="-1" aria-label="Jour précédent">‹</button><div class="dmid"><b>${esc(cap(fmtD(S.date)))}</b><br>${S.date===today()?'<span class="tag">Aujourd’hui</span>':'<button class="s" data-a="dToday">Revenir à aujourd’hui</button>'}</div><button data-a="dNav" data-v="1" aria-label="Jour suivant">›</button><input type="date" value="${S.date}" data-c="setDate" aria-label="Choisir une date"></div>`;
function calCard(){const t=tot(S.date),g=D.goals,rem=has(g.kcal)?g.kcal-t.kcal:null;
  return `<div class="kpis">${kpi('Calories consommées',fmt(t.kcal)+' kcal')}${kpi('Calories restantes',rem==null?'—':rem>=0?fmt(rem)+' kcal':'Dépassement '+fmt(-rem)+' kcal',has(g.kcal)?'objectif '+fmt(g.kcal)+' kcal':'objectif non défini')}${kpi('Protéines consommées',fmt(t.prot)+' g',has(g.prot)?'objectif '+fmt(g.prot)+' g':'')}</div>
  ${has(g.kcal)&&g.kcal>0?bar(t.kcal/g.kcal*100,t.kcal>g.kcal):'<p class="muted small">Renseignez votre objectif calorique dans Réglages pour afficher les calories restantes.</p>'}`}

/* ================= Chronomètre ================= */
const T={total:0,rem:0,end:0,run:false,label:'',fin:false};
let AC=null;
document.addEventListener('pointerdown',()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(AC.state==='suspended')AC.resume()});
function tStart(sec,label){sec=+sec||0;if(sec<=0)return;T.total=sec;T.rem=sec*1000;T.label=label||'';T.fin=false;T.end=Date.now()+T.rem;T.run=true;updTimer()}
function tPause(){if(!T.run)return;T.rem=Math.max(0,T.end-Date.now());T.run=false;updTimer()}
function tResume(){if(T.run||T.rem<=0)return;T.end=Date.now()+T.rem;T.run=true;T.fin=false;updTimer()}
function tReset(){T.run=false;T.rem=T.total*1000;T.fin=false;updTimer()}
function tStop(){T.run=false;T.total=0;T.rem=0;T.fin=false;T.label=''}
function ring(){
  if(AC){try{AC.resume();[0,.35,.7].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+t;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.3,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.25);o.start(s);o.stop(s+.3)})}catch(e){}}
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
const tfmt=()=>{const s=Math.ceil(T.rem/1000);return Math.floor(s/60)+':'+pad(s%60)};
const elapsed=r=>{if(!r||!r.start)return '0:00';const s=Math.floor((Date.now()-r.start)/1000),h=Math.floor(s/3600);return (h?h+':'+pad(Math.floor(s/60)%60):Math.floor(s/60))+':'+pad(s%60)};
function updTimer(){
  const d=$('#tdisp');if(d)d.textContent=tfmt();
  const l=$('#tlabel');if(l)l.textContent=T.label||'Chronomètre';
  const b=$('#ttog');if(b){b.textContent=T.run?'Pause':(T.rem>0&&T.rem<T.total*1000?'Reprendre':'Démarrer');b.disabled=!T.total}
  const m=$('#tmsg');if(m)m.textContent=T.fin?'⏰ Terminé. Passez à la carte suivante quand vous êtes prêt(e).':'';
  const e=$('#elapsed');if(e)e.textContent=elapsed(D.run);
}
/* La fin du chronomètre sonne mais ne fait jamais avancer les cartes. */
setInterval(()=>{if(T.run){T.rem=Math.max(0,T.end-Date.now());if(T.rem<=0){T.run=false;T.fin=true;ring()}}updTimer()},250);

/* ================= Fenêtre de saisie ================= */
let MF=null;
function modal(title,body,onOk,okLabel='Enregistrer'){
  const m=$('#modal');
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><div class="row sb"><h3>${esc(title)}</h3><button type="button" class="s" data-a="mClose" aria-label="Fermer">✕</button></div><form id="mform"><div class="err" hidden></div>${body}<div class="row end"><button type="button" data-a="mClose">Annuler</button><button class="p">${okLabel}</button></div></form></div>`;
  m.hidden=false;MF=onOk;
  const f=$('#mform');
  f.__go=()=>{if(!MF)return;let r;try{r=MF(new FormData(f),f)}catch(x){if(typeof x==='string'){const er=f.querySelector('.err');er.textContent=x;er.hidden=false;er.scrollIntoView({block:'nearest'});return}throw x}if(r!==false){closeM();commit()}};
  f.onsubmit=e=>{e.preventDefault();f.__go()};
}
function closeM(){const m=$('#modal');m.hidden=true;m.innerHTML='';MF=null}
function nv(fd,k,label,o={}){const raw=fd.get(k);if(raw==null||String(raw).trim()===''){if(o.req)throw `« ${label} » est obligatoire.`;return null}
  const v=num(raw);if(!isFinite(v))throw `« ${label} » doit être un nombre.`;
  if(o.min!=null&&v<o.min)throw `« ${label} » doit être supérieur ou égal à ${o.min}.`;
  if(o.max!=null&&v>o.max)throw `« ${label} » doit être inférieur ou égal à ${o.max}.`;
  return o.int?Math.round(v):v}
const tv=(fd,k,label,req)=>{const v=String(fd.get(k)||'').trim();if(req&&!v)throw `« ${label} » est obligatoire.`;return v};
const dv=(fd,k)=>{const v=fd.get(k);if(!v||!/^\d{4}-\d{2}-\d{2}$/.test(v))throw 'Date invalide.';return v};

function dayBlocks(s){
  const wd=pd(s).getDay(),B=[],t=tot(s),g=D.goals;
  const rb=(r,k,icon,name)=>{if(r)B.push({k,icon,name,desc:`${r.steps.length} étapes`,done:!!logOf(s,r.id),kind:'rou',r})};
  if(wd===1)B.push({k:'mes',icon:'📏',name:'Mensurations',desc:'Poids et mensurations',done:!!(D.body.valid||{})[s],kind:'mes'});
  rb(morningRou(),'am','☀️','Soins du matin');
  planStatus(s).forEach(p=>{const f=p.ses[0],rp=p.w&&p.w.slot===p.id,rs=rp&&getSes(p.w.sessionId);
    B.push({k:'sp-'+p.id,icon:sIcon(rs||f),name:rp?p.w.name:(p.label||p.ses.map(x=>x.name).join(' ou ')),desc:(rp?'à la place de '+f.name+' · ':(f.type==='muscu'?'Musculation · ':''))+(p.w?'≈ '+fmt(wKcal(p.w))+' kcal':dur(p.duration))+(p.w&&p.ses.length>1&&!rp?' · '+p.w.name:''),done:!!p.w,kind:'sport',p})});
  B.push({k:'food',icon:'🍽️',name:'Alimentation',desc:`${fmt(t.kcal)} kcal${has(g.kcal)?' / '+fmt(g.kcal):''}`,done:getDay(s).food.length>0,kind:'food'});
  rb(eveningRou(wd),'pm','🌙',wd===0?'Soins du soir du dimanche':'Soins du soir');
  return B;
}
function blockDet(b,s){

    return `<p class="muted small">Séance de boxe habituelle (${dur(p.duration)}) : le bouton ▶ la valide.</p><div class="btns"><button class="s p" data-a="boxDone" data-pid="${p.id}">Valider la boxe</button>${cs?`<button class="s" data-a="startRun" data-id="${cs.id}" data-slot="${p.id}">Remplacer par calisthénie</button>`:''}</div>`}
  const wd=p.w?`<p><span class="tag ok">${esc(p.w.name)} réalisée · ${dur(p.w.duration)}${has(p.w.distance)?' · '+fmt(dShow(p.w,p.w.distance))+' '+dUnit(p.w):''} · ≈ ${fmt(wKcal(p.w))} kcal</span></p>
    ${p.w.type!=='cardio'?(p.w.exercises||[]).map(e=>`<div class="li"><span>${e.tour?esc(e.tour)+' · ':''}${esc(e.name)}</span><small class="muted">${(e.sets||[]).filter(Boolean).map(setTxt).join(' · ')}</small></div>`).join(''):''}
    ${p.w.type==='cardio'&&getSes(p.w.sessionId)?cardioHist(getSes(p.w.sessionId)):''}
    <div class="btns">${p.w.type==='cardio'?`<button class="s p" data-a="woEdit" data-id="${p.w.id}">Modifier</button>`:''}<button class="s d" data-a="undoSport" data-id="${p.w.id}">${p.w.type==='cardio'?'Supprimer':'Supprimer la séance (pour la refaire)'}</button></div>`:'';
  if(p.w)return wd;
  return p.ses.map(x=>{
    const ex=x.type==='muscu'?x.exercises.map(e=>`<div class="li"><span>${esc(e.name)}</span><small class="muted">${esc(exDesc(e))}</small></div>`).join('')
      :x.type==='cali'?x.tours.map(t=>`<div class="tour"><b>${esc(t.name)}</b>${t.exercises.map(e=>`<div class="li"><span>${esc(e.name)}</span><small class="muted">${esc(exDesc(e))}</small></div>`).join('')||'<p class="muted small">Aucun exercice.</p>'}</div>`).join(''):'';
    const hist=x.type==='cardio'?cardioHist(x):'';
    const empty=x.type!=='cardio'&&!ex.includes('class="li"')?'<p class="muted small">Exercices à compléter dans Réglages › Séances et exercices.</p>':'';

function weekBar(){
  const mon=addD(S.date,-((pd(S.date).getDay()+6)%7)),t=today();
  return `<div class="week"><button class="wnav" data-a="dNav" data-v="-7" aria-label="Semaine précédente">‹</button>${[0,1,2,3,4,5,6].map(i=>{const x=addD(mon,i),d=pd(x);
    return `<button class="wday ${x===S.date?'sel':''} ${x===t?'tod':''}" data-a="setDay" data-v="${x}" aria-label="${esc(fmtD(x))}"><small>${WD[d.getDay()]}</small><b>${d.getDate()}</b></button>`}).join('')}<button class="wnav" data-a="dNav" data-v="7" aria-label="Semaine suivante">›</button></div>`;
}
/* Jauge de déficit calorique (visuel seulement : les valeurs seront branchées plus tard). */
const DEF_GOAL=1200;
/* Énergie de la journée : base = métabolisme de base (Mifflin-St Jeor, homme) avec le dernier poids connu à cette date.
   Déficit = base + calories brûlées au sport − calories consommées. */
function bmrOn(s){const W=D.weights.filter(w=>w.date<=s).sort(byDate),kg=W.length?+W[W.length-1].value:+D.profile.startWeight;
  return {kg,v:Math.round(10*kg+6.25*(+D.profile.height||0)-5*(+D.profile.age||0)+5)}}
/* Calories du sport : la valeur saisie si elle existe, sinon une estimation MET × dernier poids enregistré × durée.
   Course avec distance : ≈ 1 kcal × kg × km. Musculation et calisthénie : durée prévue au planning. */
const isBoxe=x=>!!x&&/boxe/i.test(x.name||'');
const METS=[[/course/i,9],[/natation/i,7],[/boxe/i,8],[/yoga/i,2.75],[/v[ée]lo/i,7]];
function lastKg(){const W=[...D.weights].sort(byDate);return W.length?+W[W.length-1].value:+D.profile.startWeight}
function plannedMin(w){if(w.slot){for(const k in D.planning){const q=(D.planning[k]||[]).find(x=>x.options.includes(w.sessionId));if(q)return +q.duration}}
  const p=(D.planning[pd(w.date).getDay()]||[]).find(q=>q.id===w.slot||q.options.includes(w.sessionId));return p?+p.duration:null}
function wKcal(w){if(has(w.kcal))return +w.kcal;const kg=lastKg();
  if(/course/i.test(w.name||'')&&has(w.distance)&&+w.distance>0)return Math.round(kg*w.distance);
  const met=w.type==='muscu'?5:w.type==='cali'?6:((METS.find(m=>m[0].test(w.name||''))||[0,5])[1]);
  const min=(w.type==='cardio'?+w.duration:(plannedMin(w)||+w.duration))||0;return Math.round(met*kg*min/60)}
function dayEnergy(s){const b=bmrOn(s),burned=workoutsOn(s).reduce((a,w)=>a+wKcal(w),0),eaten=tot(s).kcal;
  return {base:b.v,kg:b.kg,burned,eaten,deficit:Math.round(b.v+burned-eaten),goal:DEF_GOAL}}
function deficitGauge(v){
  const R=92,L=2*Math.PI*R*240/360,pc=Math.max(0,Math.min(1,(v.deficit||0)/v.goal)),P=a=>[(110+R*Math.cos(a*Math.PI/180)).toFixed(2),(110+R*Math.sin(a*Math.PI/180)).toFixed(2)];
  const [x0,y0]=P(150),[x1,y1]=P(30),[kx,ky]=P(150+240*pc),arc=`M ${x0} ${y0} A ${R} ${R} 0 1 1 ${x1} ${y1}`;
  return `<div class="dgauge glass"><div class="dg-title">Déficit calorique</div>
  <div class="dg-mid"><svg viewBox="0 0 220 170" aria-hidden="true"><defs><linearGradient id="dgg" x1="0" x2="1"><stop offset="0" stop-color="#a9c7f7"/><stop offset="1" stop-color="#6f9de8"/></linearGradient></defs><path d="${arc}" class="dg-track"/><path d="${arc}" class="dg-fill" style="stroke-dasharray:${(L*pc).toFixed(1)} ${L.toFixed(1)};opacity:${pc>0?1:0}"/>${pc>0?`<circle cx="${kx}" cy="${ky}" r="6.5" class="dg-knob"/>`:''}</svg>
  <div class="dg-c"><b>${fmt(Math.abs(v.deficit))}</b><span class="dg-lab">${v.deficit<0?'Excédent':'Déficit'} · ${v.deficit>=v.goal?'objectif atteint ✓':'objectif pas encore atteint'}</span></div></div>
  <div class="dg-row"><div><i>🔥</i><span>Brûlé<b>${fmt(v.burned)}</b></span></div><div><i>🎯</i><span>Objectif<b>${fmt(v.goal)}</b></span></div><div><i>🍴</i><span>Consommé<b>${fmt(v.eaten)}</b></span></div></div></div>`;
}

function planHtml(pl){

  const g=t=>D.sessions.filter(s=>s.type===t),btns=(l,a)=>l.map(s=>`<button data-a="${a}" data-id="${s.id}">${esc(s.name)}</button>`).join('')||'<span class="muted">Aucune séance.</span>';
  const ws=[...D.workouts].sort((a,b)=>byDate(b,a));
  return dateBar()+
  `<div class="card"><h3>Prévu ce jour</h3>${planHtml(planStatus(S.date))}</div>

  <div class="card"><h3>Historique des séances (${ws.length})</h3>${ws.slice(0,S.woLim).map(woHtml).join('')||muted('Aucune séance enregistrée.')}${ws.length>S.woLim?'<button class="s" data-a="more" data-k="woLim">Afficher plus</button>':''}</div>`;
};
const secTxt=d=>d>=60&&d%60===0?(d/60)+' min':d+' s';
const setLbl=(s,u)=>(has(s.reps)?s.reps+(has(s.dur)?' rép. · '+secTxt(s.dur):''):has(s.dur)?secTxt(s.dur):'—')+(has(s.weight)?' à '+fmt(s.weight)+' '+(u||'kg'):'');

function bodyChart(L,goal,u,H0){

function pcHtml(x,i,cls){const c=PCOL[x.col]||[CPAL[i%CPAL.length],CPAL[(i+3)%CPAL.length],'#3c3f4a'],src=x.photo||PIMG[x.img];
  return `<div class="pc ${cls}" style="--c1:${c[0]};--c2:${c[1]};--ci:${c[2]}"><div class="pcard"><div class="pinfo">${x.category?`<span class="ppill">${esc(x.category)}</span>`:''}<h2>${esc(x.name)}</h2><p>${esc([x.brand,x.product].filter(Boolean).join(' · '))}</p>${x.desc?`<p class="pdesc">${esc(x.desc)}</p>`:''}</div></div>

function rView(){
  const rr=D.rrun,r=getRou(rr.rid);
  if(!r||!r.steps.length){D.rrun=null;save();return P.care()}
  const n=r.steps.length;rr.idx=Math.max(0,Math.min(+rr.idx||0,n-1));const i=rr.idx,x=r.steps[i];
  const an=S.anim>0?'enter':'';S.anim=0;
  const back=[2,1].map(k=>i+k<n?pcHtml(r.steps[i+k],i+k,'back b'+k):'').join('');
  const prev=i>0?pcHtml(r.steps[i-1],i-1,'prev'):'';
  return `<div class="cs pcs" id="cs"><div class="cs-head"><div class="cs-ht"><small>${esc(r.name)} · ${i+1} / ${n}</small><h1>${esc(csTitle(x))}</h1></div><button class="cs-x" data-a="rQuit" aria-label="Quitter la routine">×</button></div>
  <div class="cs-stage pstage"><div class="pslot">${back}${pcHtml(x,i,'front '+an)}${prev}</div></div>
  <div class="cs-dots">${r.steps.map((_,k)=>`<span class="cs-dot ${k<=i?'seen':''} ${k===i?'cur':''}">${k+1}</span>`).join('')}</div>
  <p class="cs-hint">${i===n-1?'Glissez vers la droite pour terminer la routine':'Glissez vers la droite pour avancer, vers la gauche pour revenir'}</p></div>`;
}
let csBusy=false,csSuppress=0;
const prevPos=t=>`translateX(${((1-t)*125).toFixed(1)}%) rotate(${((1-t)*16).toFixed(1)}deg)`;
const PTILT=-4;
/* Avancer : la carte part en premier, le produit la suit avec un léger décalage (deux calques séparés).
   Revenir : la fiche précédente revient depuis la droite, son produit un peu en retard sur la carte. */
function csGo(dir){
  const rr=D.rrun,r=rr&&getRou(rr.rid);if(csBusy||!r)return;
  const f=$('#cs .pc.front'),pv=$('#cs .pc.prev'),n=r.steps.length;if(!f)return;
  const fc=f.querySelector('.pcard'),fp=f.querySelector('.pprod');
  if(dir<0){
    if(!pv){[fc,fp].forEach(e=>{e.style.transition='transform .35s cubic-bezier(.3,1.6,.5,1)';e.style.transform=e===fp?`rotate(${PTILT}deg)`:''});return}
    csBusy=true;const pc=pv.querySelector('.pcard'),pp=pv.querySelector('.pprod');
    [fc,fp].forEach(e=>{e.style.transition='transform .3s ease-out';e.style.transform=e===fp?`rotate(${PTILT}deg)`:''});
    pc.style.transition='transform .34s cubic-bezier(.2,.8,.3,1)';pc.style.transform='none';
    pp.style.transition='transform .42s cubic-bezier(.2,.8,.3,1) .05s';pp.style.transform=`rotate(${PTILT}deg)`;
    setTimeout(()=>{csBusy=false;if(!D.rrun)return;rr.idx--;S.anim=0;commit()},470);return}
  csBusy=true;
  fc.style.transition='transform .34s cubic-bezier(.5,0,.75,0),opacity .34s';fc.style.transform='translateX(125%) rotate(9deg)';fc.style.opacity='0';
  fp.style.transition='transform .42s cubic-bezier(.5,0,.75,0) .06s,opacity .42s .06s';fp.style.transform=`translateX(190%) rotate(${PTILT+12}deg)`;fp.style.opacity='0';
  setTimeout(()=>{csBusy=false;if(!D.rrun)return;if(rr.idx>=n-1)return finishRoutine();rr.idx++;S.anim=1;commit()},470);
}
function finishRoutine(){
  const rr=D.rrun,r=getRou(rr.rid);
  D.routineLogs=D.routineLogs.filter(l=>!(l.date===rr.date&&l.routineId===rr.rid));
  D.routineLogs.push({id:uid(),ts:Date.now(),date:rr.date,routineId:rr.rid,name:r?r.name:''});
  D.rrun=null;S.date=rr.date;S.page='today';window.scrollTo(0,0);commit();toast('Routine terminée !');
}
function bindCare(){
  const cs=$('#cs');if(!cs)return;const st=cs.querySelector('.cs-stage'),f=st&&st.querySelector('.pc.front'),pv=st&&st.querySelector('.pc.prev');
  if(f){const fc=f.querySelector('.pcard'),fp=f.querySelector('.pprod'),pc=pv&&pv.querySelector('.pcard'),pp=pv&&pv.querySelector('.pprod');
    let x0=null,dx=0,moved=false,pid=null;const W=()=>st.clientWidth||300;
    const prevAt=t=>{if(!pv)return;pc.style.transform=`translateX(${((1-t)*125).toFixed(1)}%) rotate(${((1-t)*12).toFixed(1)}deg)`;const tp=Math.max(0,t-.12)/.88;pp.style.transform=`translateX(${((1-tp)*150).toFixed(1)}%) rotate(${(PTILT+(1-tp)*14).toFixed(1)}deg)`};
    st.addEventListener('pointerdown',e=>{if(csBusy||(e.pointerType==='mouse'&&e.button!==0))return;x0=e.clientX;dx=0;moved=false;pid=e.pointerId;[fc,fp,pc,pp].forEach(el=>{if(el)el.style.transition='none'})});
    let raf=0;const paint=()=>{raf=0;if(x0==null)return;
      if(dx>=0){fc.style.transform=`translate3d(${dx}px,0,0) rotate(${dx/26}deg)`;fp.style.transform=`translate3d(${dx*.82}px,0,0) rotate(${PTILT+dx/34}deg)`;prevAt(0)}
      else if(pv){fc.style.transform='';fp.style.transform=`rotate(${PTILT}deg)`;prevAt(Math.min(1,-dx/(W()*.9)))}
      else{fc.style.transform=`translate3d(${dx/4}px,0,0)`;fp.style.transform=`translate3d(${dx/5}px,0,0) rotate(${PTILT}deg)`}};
    st.addEventListener('pointermove',e=>{if(x0==null||e.pointerId!==pid)return;dx=e.clientX-x0;
      if(!moved&&Math.abs(dx)>6){moved=true;try{st.setPointerCapture(pid)}catch(_){}}if(!moved)return;
      if(!raf)raf=requestAnimationFrame(paint)});
    const end=()=>{if(x0==null)return;x0=null;if(raf){cancelAnimationFrame(raf);raf=0}if(!moved)return;csSuppress=Date.now();
      if(dx>80)csGo(1);else if(dx<-80&&pv)csGo(-1);
      else{fc.style.transition='transform .4s cubic-bezier(.3,1.4,.5,1)';fp.style.transition='transform .5s cubic-bezier(.3,1.4,.5,1) .03s';fc.style.transform='';fp.style.transform=`rotate(${PTILT}deg)`;
        if(pv){pc.style.transition=pp.style.transition='transform .3s ease-out';prevAt(0)}}};
    st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end)}
  /* Zones invisibles : moitié droite = suivante, moitié gauche = précédente (ignorées juste après un glissement). */
  cs.addEventListener('click',e=>{if(Date.now()-csSuppress<400||e.target.closest('button,a,input,select,textarea,label'))return;csGo(e.clientX>=window.innerWidth/2?1:-1)});
}
