P.well=()=>{
  const w=getDay(S.date).well;
  return dateBar()+`<div class="card"><h3>Bien-être</h3><form data-f="well">
  <div class="f"><span>Qualité du sommeil <small class="muted">(1 = mauvaise, 5 = excellente)</small></span><div class="rate">${[1,2,3,4,5].map(i=>`<label><input type="radio" name="sleepQ" value="${i}" ${+w.sleepQ===i?'checked':''}><span>${i}</span></label>`).join('')}</div></div>
  <div class="grid2">${F('Durée du sommeil (heures)',N('sleepH',w.sleepH??''))}</div>${F('Notes personnelles',TA('notes',w.notes,4))}
  <div class="row end">${Object.keys(w).length?'<button type="button" class="d" data-a="wellClear">Effacer</button>':''}<button class="p">Enregistrer</button></div></form></div>`;
};

/* ----- Réglages ----- */
const serRow=x=>`<div class="ser"><input name="sr" inputmode="numeric" placeholder="—" value="${esc(x.reps??'')}" aria-label="Répétitions"><input name="sw" inputmode="decimal" placeholder="—" value="${esc(x.weight??'')}" aria-label="Poids"><input name="sd" inputmode="numeric" placeholder="—" value="${esc(x.dur??'')}" aria-label="Durée"><button type="button" class="s d" data-a="serDel" aria-label="Supprimer la série">✕</button></div>`;
const sec=(k,title,body)=>`<details class="card set" data-k="${k}" ${S.open.has(k)?'open':''}><summary>${title}</summary>${body}</details>`;
function exRows(s,list,tid){const t=tid?`data-t="${tid}"`:'';
  return list.map(e=>`<div class="li"><span>${esc(e.name)}<br><small class="muted">${esc([e.group,serDesc(e)].filter(Boolean).join(' · '))}</small></span><span class="acts">${ud('exMv',e.id,`data-s="${s.id}" ${t}`)}<button class="s" data-a="exEdit" data-s="${s.id}" ${t} data-id="${e.id}">✎</button><button class="s d" data-a="exDel" data-s="${s.id}" ${t} data-id="${e.id}">✕</button></span></div>`).join('')||muted('Aucun exercice.')}
P.settings=()=>{
  const pr=D.profile,g=D.goals;
  const sessions=D.sessions.map(s=>`<details class="sub" data-k="s-${s.id}" ${S.open.has('s-'+s.id)?'open':''}><summary><b>${esc(s.name)}</b> <small class="muted">${TYPEL[s.type]}</small></summary>
    <div class="btns">${ud('sesMv',s.id)}<button class="s" data-a="sesEdit" data-id="${s.id}">Renommer</button><button class="s d" data-a="sesDel" data-id="${s.id}">Supprimer</button></div>
    ${s.type==='muscu'?exRows(s,s.exercises)+`<button class="s p" data-a="exEdit" data-s="${s.id}" style="margin-top:6px">+ Exercice</button>`:''}
    ${s.type==='cali'?s.tours.map(t=>`<div class="tour"><div class="row sb"><b>${esc(t.name)}</b><span class="acts">${ud('tourMv',t.id,`data-s="${s.id}"`)}<button class="s" data-a="tourEdit" data-s="${s.id}" data-id="${t.id}">✎</button><button class="s d" data-a="tourDel" data-s="${s.id}" data-id="${t.id}">✕</button></span></div>${exRows(s,t.exercises,t.id)}<button class="s p" data-a="exEdit" data-s="${s.id}" data-t="${t.id}" style="margin-top:6px">+ Exercice</button></div>`).join('')+`<button class="s" data-a="tourEdit" data-s="${s.id}" style="margin-top:8px">+ Tour</button>`:''}</details>`).join('');
  const plan=[1,2,3,4,5,6,0].map(day=>`<div class="plan"><div class="row sb"><b>${WDL[day]}</b><button class="s" data-a="planEdit" data-day="${day}">+ Ajouter</button></div>${(D.planning[day]||[]).map(p=>{const ss=p.options.map(getSes).filter(Boolean);return ss.length?`<div class="li"><span>${p.label?esc(p.label)+' — ':''}${ss.map(s=>esc(s.name)).join(' ou ')} · ${dur(p.duration)}</span><span class="acts">${ud('planMv',p.id,`data-day="${day}"`)}<button class="s" data-a="planEdit" data-day="${day}" data-id="${p.id}">✎</button><button class="s d" data-a="planDel" data-day="${day}" data-id="${p.id}">✕</button></span></div>`:''}).join('')||'<small class="muted">Repos</small>'}</div>`).join('');
  const routines=D.routines.map(r=>`<details class="sub" data-k="r-${r.id}" ${S.open.has('r-'+r.id)?'open':''}><summary><b>${esc(r.name)}</b> <small class="muted">${r.steps.length} étapes · ${daysLbl(r.days)}</small></summary>
    <div class="btns">${ud('rouMv',r.id)}<button class="s" data-a="rouEdit" data-id="${r.id}">Modifier</button><button class="s d" data-a="rouDel" data-id="${r.id}">Supprimer</button></div>
    ${r.steps.map((x,i)=>`<div class="li"><span>${i+1}. ${x.photo?'🖼️ ':''}${esc(x.name)}<br><small class="muted">${esc([x.product,x.brand,x.category].filter(Boolean).join(' · '))}</small></span><span class="acts">${ud('stepMv',x.id,`data-r="${r.id}"`)}<button class="s" data-a="stepEdit" data-r="${r.id}" data-id="${x.id}">✎</button><button class="s d" data-a="stepDel" data-r="${r.id}" data-id="${x.id}">✕</button></span></div>`).join('')}<button class="s p" data-a="stepEdit" data-r="${r.id}" style="margin-top:6px">+ Étape</button></details>`).join('');
  return `<div class="row sb" style="margin-bottom:8px"><h2 style="margin:0">Réglages</h2><button class="cs-x xs" data-a="go" data-p="today" aria-label="Retour à l’accueil">×</button></div>`+
  sec('profil','👤 Profil et poids',`<form data-f="profile"><div class="grid2">${F('Âge',N('age',pr.age))}${F('Taille (cm)',N('height',pr.height))}${F('Poids de départ (kg)',N('startWeight',pr.startWeight,'required'))}${F('Poids cible (kg)',N('targetWeight',pr.targetWeight,'required'))}</div><button class="p">Enregistrer</button></form>`)+
  sec('obj','🎯 Objectifs alimentaires',`<form data-f="goals"><div class="grid2">${F('Calories par jour (kcal)',N('kcal',g.kcal))}${F('Protéines par jour (g)',N('prot',g.prot))}</div><button class="p">Enregistrer</button></form>`)+
  sec('ses','🏋️ Séances et exercices',`${sessions}<div class="btns"><button class="p s" data-a="sesEdit">+ Nouvelle séance</button></div>`)+
  sec('plan','📅 Planning hebdomadaire',`<p class="muted small">Une activité planifiée n’est jamais comptée comme réalisée sans enregistrement. Plusieurs séances sur une ligne = au choix (ex. boxe ou calisthénie).</p>${plan}`)+
  sec('rou','🧴 Routines de soins',`${routines}<div class="btns"><button class="p s" data-a="rouEdit">+ Nouvelle routine</button></div>`)+
  sec('backup','💾 Sauvegarde',`<p class="muted small">Vos données sont enregistrées uniquement sur cet appareil. Faites une sauvegarde régulièrement et rangez le fichier dans iCloud Drive.${D.lastBackup?` Dernière sauvegarde : ${esc(fmtD(D.lastBackup,{day:'numeric',month:'long',year:'numeric'}))}.`:' Aucune sauvegarde pour le moment.'}</p>
  <div class="btns"><button class="p" data-a="backupSave">Sauvegarder mes données</button><label class="f" style="margin:0"><span>Restaurer une sauvegarde</span><input type="file" accept=".json,application/json" data-c="backupLoad"></label></div>`)+
  sec('data','🗑️ Réinitialisation',`<p class="muted small">Les données sont enregistrées localement dans ce navigateur, sur cet appareil.</p><button class="d" data-a="resetAll">Réinitialiser toutes les données</button>`);
};

/* ================= Rendu ================= */
const PAGES=[['today','☀️','Aujourd’hui'],['sport','🏋️','Sport'],['food','🍽️','Alimentation'],['body','🧍','Corps'],['care','🧴','Soins'],['well','🌿','Bien-être'],['settings','⚙️','Réglages']];
function render(){
  if((S.page==='sport'&&!D.run)||(S.page==='care'&&!D.rrun)||['food','well','weight'].includes(S.page))S.page='today';
  $('#main').innerHTML=P[S.page]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===S.page));
  updTimer();bindCare();bindSport();chPaint();
}

/* ================= Actions ================= */
const A={
  go:d=>{S.sheet=null;S.page=d.p;window.scrollTo(0,0);render()},
  mClose:closeM,
  dNav:d=>{S.date=addD(S.date,+d.v);render()},
  dToday:()=>{S.date=today();render()},
  setDay:d=>{S.date=d.v;render()},
  bExp:d=>{const k=S.date+'|'+d.k;S.exp.has(k)?S.exp.delete(k):S.exp.add(k);render()},
  bGo:d=>{const b=dayBlocks(S.date).find(x=>x.k===d.k);if(!b)return;
    if(b.kind==='mes')return A.go({p:'body'});
    if(b.kind==='food')return A.foodSheet();
    if(b.kind==='rou')return A.rStart({id:b.r.id});
    if(b.done){const w=b.p.w;if(isBoxe(b.p.ses[0])&&w&&!w.slot)return A.undoSport({id:w.id});if(w&&w.type==='cardio')return cardioForm(null,w.id);return A.bExp(d)}
    if(isBoxe(b.p.ses[0]))return A.boxDone({pid:b.p.id});
    if(b.p.ses.length>1)return A.bExp(d);
    const x=b.p.ses[0];return x.type==='cardio'?A.logCardio({id:x.id}):A.startRun({id:x.id})},
  more:d=>{S[d.k]+=30;render()},
  // Sport
  boxDone:d=>{const p=(D.planning[pd(S.date).getDay()]||[]).find(q=>q.id===d.pid);if(!p)return;const x=getSes(p.options[0]);
    D.workouts.push({id:uid(),ts:Date.now(),date:S.date,sessionId:x.id,name:x.name,type:'cardio',duration:+p.duration,kcal:null});commit();toast(x.name+' validée ✓')},
  undoSport:d=>{if(confirm('Annuler la validation de cette séance ?')){D.workouts=D.workouts.filter(w=>w.id!==d.id);commit()}},
  startRun:d=>{const s=getSes(d.id);if(!s)return;S.cameFrom=S.page;
    if(D.run&&D.run.sid!==s.id&&!confirm('Une séance est déjà en cours. L’abandonner pour démarrer celle-ci ?')){S.page='sport';return render()}
    if(!D.run||D.run.sid!==s.id)D.run={sid:s.id,name:s.name,type:s.type,date:S.date,start:Date.now(),logs:{},deck:null,slot:d.slot||null};
    chStop();S.flip=false;S.page='sport';window.scrollTo(0,0);commit()},
  deckOpen:d=>{const r=D.run,s=r&&getSes(r.sid);if(!s)return;const [kind,id,start]=d.k.split(':');let pos=0;
    if(kind==='t'){const t=s.tours.find(x=>x.id===id);if(!t)return;pos=t.exercises.slice(0,+start||0).reduce((a,e)=>a+e.series.length,0)}
    r.deck={kind,id,pos,phase:'card'};if(!cardsOf(r,s).length){r.deck=null;return alert('Cet exercice ne contient aucune série. Complétez-le dans Réglages.')}
    S.flip=false;S.anim=0;deckEnter();window.scrollTo(0,0);commit()},
  deckClose:()=>{if(D.run){D.run.deck=null;S.flip=false;chStop();commit()}},
  chToggle:()=>chToggle(),
  setSave:()=>{const r=D.run,s=getSes(r.sid),c=cardsOf(r,s)[r.deck.pos];if(!c)return;
    const g=id=>{const el=document.getElementById(id);if(!el)return undefined;const v=el.value.trim();return v===''?null:num(v)};
    const reps=g('fReps'),du=g('fDur'),w=g('fW');
    for(const [x,l] of [[reps,'Répétitions'],[du,'Durée'],[w,'Poids']])if(x!=null&&(!isFinite(x)||x<0))return alert(`« ${l} » doit être un nombre positif.`);
    logSet(r,c,{st:'done',reps:reps===undefined?c.reps:reps,dur:du===undefined?c.dur:du,weight:w===undefined?c.weight:w,unit:c.e.unit});save();spUnflip()},
  setNo:()=>{const r=D.run,s=getSes(r.sid),c=cardsOf(r,s)[r.deck.pos];if(!c)return;logSet(r,c,{st:'skip'});save();spUnflip()},
  flipBack:()=>spUnflip(),
  runAbort:()=>{const any=D.run&&Object.values(D.run.logs||{}).some(a=>a&&a.some(Boolean));
    if(!any||confirm('Quitter la séance sans l’enregistrer ? Les séries saisies seront perdues.')){D.run=null;chStop();S.page='today';window.scrollTo(0,0);commit()}},
  runFinish:()=>{const r=D.run,s=getSes(r.sid);if(!s)return;
    const list=(s.type==='cali'?s.tours.flatMap(t=>t.exercises.map(e=>({e,tour:t.name}))):s.exercises.map(e=>({e,tour:''})))
      .map(({e,tour})=>{const L=(r.logs[e.id]||[]).filter(Boolean);return L.length?{name:e.name,tour,st:L.some(x=>x.st==='done')?'done':'skipped',sets:L}:null}).filter(Boolean);
    if(!list.length)return alert('Aucune série enregistrée pour le moment.');
    D.workouts.push({id:uid(),ts:Date.now(),slot:r.slot||null,date:r.date,sessionId:r.sid,name:r.name,type:r.type,duration:Math.max(1,Math.round((Date.now()-r.start)/60000)),exercises:list});
    /* Progression : chaque série faite devient la valeur proposée la fois suivante (répétitions et poids, série par série). */
    let up=0;if(s.type==='muscu')s.exercises.forEach(e=>(r.logs[e.id]||[]).forEach((l,i)=>{const t=e.series[i];if(!l||l.st!=='done'||!t)return;
      let ch=0;if(has(l.weight)&&+l.weight!==+t.weight){t.weight=l.weight;ch=1}if(has(l.reps)&&+l.reps!==+t.reps){t.reps=l.reps;ch=1}if(has(l.dur)&&+l.dur!==+t.dur){t.dur=l.dur;ch=1}up+=ch}));
    D.run=null;chStop();S.flip=false;S.date=r.date;S.page='today';window.scrollTo(0,0);commit();toast(up?`Séance terminée ! ${up} série(s) mise(s) à jour pour la prochaine fois`:'Séance terminée !')},
  logCardio:d=>cardioForm(d.id),
  woEdit:d=>{const w=D.workouts.find(x=>x.id===d.id);if(!w)return;if(w.type==='cardio')return cardioForm(null,w.id);
    modal('Modifier la séance',`<div class="grid2">${F('Date',DT('date',w.date))}${F('Durée (min)',N('duration',w.duration,'required'))}</div>`,
    fd=>{w.date=dv(fd,'date');w.duration=nv(fd,'duration','Durée',{req:true,min:1,max:1440,int:true})})},
  woDel:d=>{if(confirm('Supprimer cette séance de l’historique ?')){D.workouts=D.workouts.filter(w=>w.id!==d.id);commit()}},
  // Alimentation
  foodEdit:d=>{const e=dayW(S.date).food.find(x=>x.id===d.id);if(!e)return;
    modal('Modifier l’aliment',`${F('Aliment',I('name',e.name,'required maxlength="80"'))}<div class="grid2">${F('Calories (kcal)',N('kcal',e.kcal,'required'))}${F('Protéines (g)',N('prot',e.prot))}</div>`,
    fd=>{Object.assign(e,{name:tv(fd,'name','Aliment',true),kcal:nv(fd,'kcal','Calories',{req:true,min:0,max:10000}),prot:nv(fd,'prot','Protéines',{min:0,max:1000})||0})})},
  foodDel:d=>{if(confirm('Supprimer cet aliment ?')){const t=dayW(S.date);t.food=t.food.filter(x=>x.id!==d.id);commit()}},
  // Mon corps
  foodSheet:()=>{S.sheet='food';S.sheetAnim=true;render();setTimeout(()=>{const i=$('.fsheet input[name=name]');if(i&&matchMedia('(hover:hover)').matches)i.focus()},320)},
  sheetClose:()=>{const sh=$('.fsheet'),sd=$('.shade');S.sheet=null;if(sh){sh.classList.add('down');if(sd)sd.classList.add('down');setTimeout(render,230)}else render()},
  bodyZone:d=>{S.zone=d.z;render()},
  bmValid:()=>{(D.body.valid=D.body.valid||{})[S.date]=true;S.zone='poids';S.page='today';window.scrollTo(0,0);commit();toast('Mesures validées !')},
  bmNext:()=>{const k=ZORDER.indexOf(S.zone);S.zone=ZORDER[(k+1)%ZORDER.length];render();const i=$('.zp-add input[name=value]');if(i&&matchMedia('(hover:hover)').matches)i.focus()},
  bmHist:d=>{const z=d.z,u=zUnit(z),L=zList(z).reverse();modal('Historique — '+ZNAME[z],L.map(m=>`<div class="li"><span>${fmtD(m.date,{day:'numeric',month:'long',year:'numeric'})}</span><span class="row"><b>${fmt(m.value)} ${u}</b><button type="button" class="s" data-a="bmEdit" data-z="${z}" data-id="${m.id}" aria-label="Modifier">✎</button><button type="button" class="s d" data-a="bmDel" data-z="${z}" data-id="${m.id}" aria-label="Supprimer">✕</button></span></div>`).join('')||muted('Aucune mesure.'),()=>{},'Fermer')},
  bmAdd:d=>{const z=d.z,u=zUnit(z);modal('Ajouter une mesure — '+ZNAME[z],`<div class="grid2">${F('Date',DT('date',today()))}${F(`Valeur (${u})`,N('value','','required'))}</div>`,
    fd=>{const o={id:uid(),ts:Date.now(),date:dv(fd,'date'),value:nv(fd,'value','Valeur',{req:true,...zLim(z)})};if(z==='poids')D.weights.push(o);else D.body.m.push({...o,zone:z});toast('Mesure enregistrée')})},
  bmEdit:d=>{const m=(d.z==='poids'?D.weights:D.body.m).find(x=>x.id===d.id);if(!m)return;
    modal('Modifier la mesure — '+ZNAME[d.z],`<div class="grid2">${F('Date',DT('date',m.date))}${F(`Valeur (${zUnit(d.z)})`,N('value',m.value,'required'))}</div>`,fd=>{m.date=dv(fd,'date');m.value=nv(fd,'value','Valeur',{req:true,...zLim(d.z)})})},
  bmDel:d=>{if(!confirm('Supprimer cette mesure ?'))return;closeM();if(d.z==='poids')D.weights=D.weights.filter(x=>x.id!==d.id);else D.body.m=D.body.m.filter(x=>x.id!==d.id);commit()},
  bmGoal:d=>{const z=d.z,g=zGoal(z);modal('Objectif — '+ZNAME[z],F(`Objectif (${zUnit(z)})`,N('goal',g,z==='poids'?'required':'placeholder="vide = aucun objectif"')),
    fd=>{const v=nv(fd,'goal','Objectif',{req:z==='poids',...zLim(z)});if(z==='poids')D.profile.targetWeight=v;else if(v==null)delete D.body.goals[z];else D.body.goals[z]=v})},
  // Poids
  wEdit:d=>{const m=D.weights.find(x=>x.id===d.id);if(!m)return;modal('Modifier la pesée',`<div class="grid2">${F('Date',DT('date',m.date))}${F('Poids (kg)',N('value',m.value,'required'))}</div>`,fd=>{m.date=dv(fd,'date');m.value=nv(fd,'value','Poids',{req:true,min:20,max:400})})},
  wDel:d=>{if(confirm('Supprimer cette pesée ?')){D.weights=D.weights.filter(x=>x.id!==d.id);commit()}},
  // Soins
  rStart:d=>{const r=getRou(d.id);if(!r)return;if(!r.steps.length)return alert('Cette routine ne contient aucune étape.');D.rrun={rid:r.id,date:S.date,idx:0};S.page='care';window.scrollTo(0,0);commit()},
  rQuit:()=>{D.rrun=null;S.page='today';window.scrollTo(0,0);commit()},
  logDel:d=>{if(confirm('Supprimer cet enregistrement ?')){D.routineLogs=D.routineLogs.filter(l=>l.id!==d.id);commit()}},
  wellClear:()=>{if(confirm('Effacer le bien-être de ce jour ?')){dayW(S.date).well={};commit()}},
  // Réglages : séances
  sesMv:d=>{mvArr(D.sessions,d.id,+d.v);commit()},
  sesEdit:d=>{const s=d.id&&getSes(d.id);
    modal(s?'Renommer la séance':'Nouvelle séance',`${F('Nom',I('name',s?s.name:'','required maxlength="60"'))}${s?'':F('Type',SEL('type',Object.entries(TYPEL),'muscu'))}`,
    fd=>{const name=tv(fd,'name','Nom',true);if(s){s.name=name;return}const type=fd.get('type'),n={id:uid(),name,type};
      if(type==='muscu')n.exercises=[];if(type==='cali')n.tours=[{id:uid(),name:'Tour 1',exercises:[]}];D.sessions.push(n);S.open.add('s-'+n.id)})},
  sesDel:d=>{const s=getSes(d.id);if(s&&confirm(`Supprimer la séance « ${s.name} » ? Elle sera retirée du planning (l’historique est conservé).`)){D.sessions=D.sessions.filter(x=>x.id!==d.id);
    for(const k in D.planning)D.planning[k]=D.planning[k].map(p=>({...p,options:p.options.filter(o=>o!==d.id)})).filter(p=>p.options.length);commit()}},
  exMv:d=>{mvArr(exList(getSes(d.s),d.t),d.id,+d.v);commit()},
  exEdit:d=>{const s=getSes(d.s),list=exList(s,d.t),e=d.id&&list.find(x=>x.id===d.id),o=e||{name:'',group:'',unit:'kg',rest:null,auto:false,series:[{reps:null,weight:null,dur:null}]};
    modal(e?'Modifier l’exercice':'Nouvel exercice — '+s.name,`${F('Nom',I('name',o.name,'required maxlength="60"'))}<div class="grid2">${F(s.type==='cali'?'Groupe (ex. Finisseur)':'Groupe (ex. Groupe I)',I('group',o.group,'maxlength="40"'))}${F('Unité de poids',SEL('unit',[['kg','kg'],['lb','lb']],o.unit))}${F('Repos après chaque série (s)',N('rest',o.rest,`placeholder="${s.type==='cali'?'10':'90'}"`))}</div>
    <div class="f"><span>Séries — une ligne par série</span><div class="serh"><span>Répétitions</span><span>Poids</span><span>Durée (s)</span><span></span></div><div id="serList">${o.series.map(serRow).join('')}</div><button type="button" class="s" data-a="serAdd">+ Série</button></div>
    <label class="ck"><input type="checkbox" name="auto" ${o.auto?'checked':''}><span>Démarrer le chrono automatiquement à l’ouverture de la carte (exercices chronométrés, ex. planche)</span></label>`,
    fd=>{const R=fd.getAll('sr'),W=fd.getAll('sw'),Du=fd.getAll('sd'),series=[];
      for(let i=0;i<R.length;i++){const P=(v,l,int)=>{v=String(v).trim();if(v==='')return null;const x=num(v);if(!isFinite(x)||x<0)throw `Série ${i+1} : « ${l} » invalide.`;return int?Math.round(x):x};
        const sr={reps:P(R[i],'Répétitions',1),weight:P(W[i],'Poids'),dur:P(Du[i],'Durée',1)};if(sr.reps==null&&sr.dur==null)throw `Série ${i+1} : indiquez des répétitions ou une durée.`;series.push(sr)}
      if(!series.length)throw 'Ajoutez au moins une série.';
      const x={name:tv(fd,'name','Nom',true),group:tv(fd,'group'),unit:fd.get('unit')||'kg',rest:nv(fd,'rest','Repos',{min:0,max:3600,int:true}),auto:!!fd.get('auto'),series};
      if(x.auto&&!series.some(z=>z.dur!=null))throw 'Indiquez une durée dans au moins une série pour activer le chrono automatique.';
      if(e)Object.assign(e,x);else list.push({id:uid(),...x})})},
  serAdd:()=>{const L=$('#serList'),rows=L.querySelectorAll('.ser'),last=rows[rows.length-1],g=n=>last?last.querySelector(`[name=${n}]`).value:'';L.insertAdjacentHTML('beforeend',serRow({reps:g('sr'),weight:g('sw'),dur:g('sd')}))},
  serDel:(d,el)=>{const L=$('#serList');if(L.querySelectorAll('.ser').length>1)el.closest('.ser').remove()},
  tourEdit:d=>{const s=getSes(d.s),t=d.id&&s.tours.find(x=>x.id===d.id);modal(t?'Renommer le tour':'Nouveau tour',F('Nom',I('name',t?t.name:'Tour '+(s.tours.length+1),'required maxlength="40"')),fd=>{const name=tv(fd,'name','Nom',true);if(t)t.name=name;else s.tours.push({id:uid(),name,exercises:[]})})},
  tourDel:d=>{const s=getSes(d.s);if(confirm('Supprimer ce tour et ses exercices ?')){s.tours=s.tours.filter(x=>x.id!==d.id);commit()}},
  tourMv:d=>{mvArr(getSes(d.s).tours,d.id,+d.v);commit()},
  exDel:d=>{const s=getSes(d.s),list=exList(s,d.t);if(confirm('Supprimer cet exercice ?')){const i=list.findIndex(x=>x.id===d.id);if(i>=0)list.splice(i,1);commit()}},
  planMv:d=>{mvArr(D.planning[d.day],d.id,+d.v);commit()},
  planEdit:d=>{if(!D.sessions.length)return alert('Créez d’abord une séance.');const p=d.id&&D.planning[d.day].find(x=>x.id===d.id);
    modal((p?'Modifier — ':'Ajouter — ')+WDL[d.day],`<div class="f"><span>Séance(s) — cochez-en plusieurs pour proposer un choix</span>${D.sessions.map(s=>`<label class="ck"><input type="checkbox" name="opt" value="${s.id}" ${p&&p.options.includes(s.id)?'checked':''}><span>${esc(s.name)}</span></label>`).join('')}</div>${F('Durée prévue (min)',N('duration',p?p.duration:'','required'))}`,
    fd=>{const options=fd.getAll('opt');if(!options.length)throw 'Choisissez au moins une séance.';const o={options,duration:nv(fd,'duration','Durée',{req:true,min:1,max:1440,int:true})};if(p)Object.assign(p,o);else D.planning[d.day].push({id:uid(),...o})})},
  planDel:d=>{if(confirm('Retirer cette activité du planning ?')){D.planning[d.day]=D.planning[d.day].filter(p=>p.id!==d.id);commit()}},
  // Réglages : routines
  rouMv:d=>{mvArr(D.routines,d.id,+d.v);commit()},
  rouEdit:d=>{const r=d.id&&getRou(d.id);modal(r?'Modifier la routine':'Nouvelle routine',`${F('Nom',I('name',r?r.name:'','required maxlength="60"'))}<div class="f"><span>Jours prévus</span>${DAYS(r?r.days:[0,1,2,3,4,5,6])}</div>`,
    fd=>{const days=fd.getAll('days').map(Number);if(!days.length)throw 'Choisissez au moins un jour.';const o={name:tv(fd,'name','Nom',true),days};if(r)Object.assign(r,o);else{const n={id:uid(),steps:[],...o};D.routines.push(n);S.open.add('r-'+n.id)}})},
  rouDel:d=>{const r=getRou(d.id);if(r&&confirm(`Supprimer la routine « ${r.name} » ? L’historique est conservé.`)){D.routines=D.routines.filter(x=>x.id!==d.id);if(D.rrun&&D.rrun.rid===d.id)D.rrun=null;commit()}},
  stepMv:d=>{mvArr(getRou(d.r).steps,d.id,+d.v);commit()},
  stepEdit:d=>{const r=getRou(d.r),x=d.id&&r.steps.find(y=>y.id===d.id),o=x||{name:'',product:'',brand:'',category:'',desc:'',photo:''};
    modal(x?'Modifier l’étape':'Nouvelle étape — '+r.name,`${F('Nom de l’étape',I('name',o.name,'required maxlength="60"'))}<div class="grid2">${F('Produit',I('product',o.product,'maxlength="80"'))}${F('Marque',I('brand',o.brand,'maxlength="60"'))}${F('Catégorie',I('category',o.category,'maxlength="40"'))}</div>${F('Courte description',TA('desc',o.desc,2))}
    <div class="f"><span>Photo du produit (facultative)</span><input type="file" accept="image/*" data-c="pickPhoto"><input type="hidden" name="photo" value="${esc(o.photo)}"><img class="phprev" src="${esc(o.photo)}" alt="" ${o.photo?'':'hidden'}>${o.photo?'<label class="ck"><input type="checkbox" name="rmPhoto"><span>Supprimer la photo</span></label>':''}</div>`,
    fd=>{const y={name:tv(fd,'name','Nom',true),product:tv(fd,'product'),brand:tv(fd,'brand'),category:tv(fd,'category'),desc:tv(fd,'desc'),photo:fd.get('rmPhoto')?'':String(fd.get('photo')||'')};if(x)Object.assign(x,y);else r.steps.push({id:uid(),...y})})},
  stepDel:d=>{const r=getRou(d.r);if(confirm('Supprimer cette étape ?')){r.steps=r.steps.filter(x=>x.id!==d.id);commit()}},
  backupSave:()=>{D.lastBackup=today();save();const name=`suivi-sauvegarde-${today()}.json`,blob=new Blob([JSON.stringify({app:'suivi-quotidien',saved:new Date().toISOString(),data:D})],{type:'application/json'});
    const file=typeof File==='function'?new File([blob],name,{type:'application/json'}):null;
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Sauvegarde suivi'}).then(()=>toast('Sauvegarde prête')).catch(()=>{});render();return}
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Sauvegarde téléchargée');render()},
  resetAll:()=>{if(confirm('Supprimer définitivement toutes les données et revenir aux valeurs initiales ?')&&confirm('Dernière confirmation : cette action est irréversible. Continuer ?')){tStop();D=defaults();S.date=today();S.page='today';commit();toast('Données réinitialisées')}},
};
const C={
  setDate:el=>{if(el.value){S.date=el.value;render()}},
  backupLoad:el=>{const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{let o;try{o=JSON.parse(rd.result);o=o&&o.data?o.data:o}catch(e){o=null}
    if(!o||typeof o!=='object'||!Array.isArray(o.sessions)||!o.days){el.value='';return alert('Ce fichier n’est pas une sauvegarde de l’application.')}
    if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){el.value='';return}
    D=o;const d=defaults();for(const k in d)if(D[k]===undefined)D[k]=d[k];D.run=null;D.rrun=null;chStop();S.date=today();S.page='today';commit();toast('Sauvegarde restaurée')};rd.readAsText(f)},
  pickPhoto:el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.8);el.form.elements.photo.value=u;const p=el.form.querySelector('.phprev');p.src=u;p.hidden=false};im.onerror=()=>alert('Image illisible.');im.src=r.result};r.readAsDataURL(f)},
};
const FS={
  addFood:(fd,f)=>{dayW(S.date).food.push({id:uid(),name:tv(fd,'name','Aliment',true),kcal:nv(fd,'kcal','Calories',{req:true,min:0,max:10000}),prot:nv(fd,'prot','Protéines',{min:0,max:1000})||0});toast('Aliment ajouté');commit();const fi=$('.fsheet input[name=name]');if(fi)fi.focus()},
  bmQuick:fd=>{const z=fd.get('z'),v=nv(fd,'value','Mesure',{req:true,...zLim(z)}),o={id:uid(),ts:Date.now(),date:S.date,value:v};if(z==='poids')D.weights.push(o);else D.body.m.push({...o,zone:z});toast('Mesure enregistrée');commit()},
  addWeight:fd=>{D.weights.push({id:uid(),ts:Date.now(),date:dv(fd,'date'),value:nv(fd,'value','Poids',{req:true,min:20,max:400})});toast('Pesée enregistrée');commit()},
  well:fd=>{const o={},q=fd.get('sleepQ');if(q)o.sleepQ=+q;const sl=nv(fd,'sleepH','Durée du sommeil',{min:0,max:24});if(sl!==null)o.sleepH=sl;const n=tv(fd,'notes');if(n)o.notes=n;dayW(S.date).well=o;toast('Enregistré');commit()},
  profile:fd=>{Object.assign(D.profile,{age:nv(fd,'age','Âge',{min:1,max:120,int:true}),height:nv(fd,'height','Taille',{min:50,max:250}),startWeight:nv(fd,'startWeight','Poids de départ',{req:true,min:20,max:400}),targetWeight:nv(fd,'targetWeight','Poids cible',{req:true,min:20,max:400})});toast('Profil enregistré');commit()},
  goals:fd=>{Object.assign(D.goals,{kcal:nv(fd,'kcal','Calories',{min:0,max:10000}),prot:nv(fd,'prot','Protéines',{min:0,max:1000})});toast('Objectifs enregistrés');commit()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(!f)return;e.preventDefault();f(el.dataset,el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el)});
/* Envoi des formulaires sans dépendre de l'événement « submit » (bloqué dans certains aperçus intégrés) :
   un clic sur un bouton d'envoi ou la touche Entrée déclenche directement l'enregistrement. */
function doSubmit(f){if(!f)return;if(f.__go)return f.__go();const k=f.dataset.f;if(!k||!FS[k])return;try{FS[k](new FormData(f),f)}catch(x){if(typeof x==='string')alert(x);else throw x}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.type!=='submit'||!b.form)return;e.preventDefault();doSubmit(b.form)},true);
document.addEventListener('submit',e=>{e.preventDefault();doSubmit(e.target)});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.target.open?S.open.add(k):S.open.delete(k)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeM()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});

/* ================= Démarrage ================= */
load();
$('#nav').innerHTML=PAGES.map(([p,i,l])=>`<button data-a="go" data-p="${p}"><i>${i}</i><span>${l}</span></button>`).join('');
if(D.run){S.page='sport';deckEnter()}else if(D.rrun)S.page='care';
render();
</script>
